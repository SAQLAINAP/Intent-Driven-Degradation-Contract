apiVersion: v1
kind: Service
metadata:
  name: {{ include "dg.fullname" . }}
  labels:
    {{- include "dg.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "dg.selector" . | nindent 4 }}
  ports:
    {{- range $name, $port := .Values.ports }}
    - name: {{ $name }}
      port: {{ $port }}
      targetPort: {{ $name }}
    {{- end }}
