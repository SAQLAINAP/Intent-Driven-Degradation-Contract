apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-engine
spec:
  selector:
    app: dg-engine
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
    - name: sidecar
      port: {{ .Values.sidecar.port }}
      targetPort: {{ .Values.sidecar.port }}
