apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dg.fullname" . }}
  labels:
    {{- include "dg.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "dg.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dg.selector" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: dg-engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/app/bin/dg-engine"]
          args:
            - --policy=/etc/dg/policy/policy.dg
            - --config=/etc/dg/config/dg-engine.yaml
          ports:
            - { name: control, containerPort: {{ .Values.ports.control }} }
            - { name: sidecar, containerPort: {{ .Values.ports.sidecar }} }
            - { name: gate, containerPort: {{ .Values.ports.gate }} }
            - { name: metrics, containerPort: {{ .Values.ports.metrics }} }
          env:
            {{- range $key := list "SLACK_WEBHOOK_URL" "PAGERDUTY_ROUTING_KEY" "GATE_AUTH_TOKEN" }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secretName }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
          readinessProbe:
            httpGet: { path: /health, port: sidecar }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: sidecar }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: policy, mountPath: /etc/dg/policy, readOnly: true }
            - { name: config, mountPath: /etc/dg/config, readOnly: true }
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: policy
          configMap:
            name: {{ .Values.policy.configMapName }}
        - name: config
          configMap:
            name: {{ include "dg.fullname" . }}-config
