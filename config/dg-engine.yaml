server:
  control_addr: ":9191"   # control API + web console — keep this port internal
  sidecar_addr: ":8081"
  gate_addr: ":9292"

signal_bus:
  tick_interval: 2s
  stale_signal_timeout: 30s
  mode: auto              # use each signal's declared source; anything not collectable falls back to injection

evaluator:
  up_hysteresis: 30s
  down_hysteresis: 90s

gate:
  slack_webhook_url: ${SLACK_WEBHOOK_URL}
  callback_base_url: https://dg.yourdomain.com
  auth_token: ${GATE_AUTH_TOKEN}

audit:
  output: stdout   # or: /var/log/dg/audit.ndjson
  format: ndjson

metrics:
  prometheus_port: 9090
  # prometheus_url: http://prometheus:9090   # required for source: prometheus signals

k8s:
  namespace: default
  leader_election: false   # set true for multi-replica control plane
