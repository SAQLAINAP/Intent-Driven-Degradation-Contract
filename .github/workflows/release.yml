name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    name: Binaries & GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: test
        run: go test -race ./...
      - name: build archives
        run: VERSION=${GITHUB_REF_NAME} bash scripts/release.sh
      - name: release notes from CHANGELOG.md
        run: |
          # Section for this version (e.g. "## [0.1.0]"), falling back to Unreleased.
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '
            $0 ~ "^## \\[" v "\\]" {on=1; next}
            on && /^## \[/ {exit}
            on {print}' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            awk '/^## \[Unreleased\]/{on=1; next} on && /^## \[/{exit} on{print}' CHANGELOG.md > notes.md
          fi
          cat >> notes.md <<NOTES

          ### Install
          - Binaries: download the archive for your platform below and verify with \`checksums.txt\`.
          - Go: \`go install github.com/${GITHUB_REPOSITORY}/cmd/dg@${GITHUB_REF_NAME}\`
          - Docker: \`docker run -p 8080:8080 -p 9191:9191 ghcr.io/saqlainap/iddc:${GITHUB_REF_NAME}\`
          NOTES
      - name: publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/checksums.txt \
            --title "$GITHUB_REF_NAME" --notes-file notes.md $flags

  image:
    name: Container image (ghcr.io)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/saqlainap/iddc
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
