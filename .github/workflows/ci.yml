name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    name: Lint, Vet, Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test (race detector)
        run: go test -race -coverprofile=coverage.out ./...

      - name: build dg binary
        run: go build ./cmd/dg

      - name: build dg-engine binary
        run: go build ./cmd/dg-engine

      - name: build demo-app binary
        run: go build ./cmd/demo-app

  smoke:
    name: End-to-end smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: smoke test (CLI demo set + live engine, gate, queue, demo app)
        run: bash scripts/smoke.sh

  docker:
    name: Docker image builds
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker build
        run: docker build -f deploy/docker/Dockerfile -t iddc-demo:ci .

  validate-example:
    name: Validate Example Policy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: validate example policy
        run: make validate-example
