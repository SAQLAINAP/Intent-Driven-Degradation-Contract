version: "2"

run:
  tests: true

linters:
  enable:
    - bodyclose
    - gosec
  settings:
    errcheck:
      # Writing an HTTP response body can only fail if the client went away;
      # there is nothing useful to do with that error.
      exclude-functions:
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
        - io.Copy
    gosec:
      excludes:
        - G402 # TLS InsecureSkipVerify — kubeconfig opt-in only
        - G107 # URL from variable — intentional in the HTTP signal fetcher
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec

formatters:
  enable:
    - gofmt
